# ============================================================
# RNA-seq pipeline configuration -- TEMPLATE
#
# Replace every /path/to/... placeholder with a real location before
# running. Nothing else needs editing for a standard run.
# ============================================================

# ------------------------------------------------------------
# Reference data, keyed by species.
#
# The species of each sample is set per-row in samples.tsv; every value
# used there must have a matching key here. Add further species by adding
# another block with the same fields.
#
#   star_genome_dir   always required
#   salmon_index_dir  always required
#   transcripts_bed   required when the bigwig or splicing branch runs
#   chrom_sizes       required when the bigwig branch runs
#   genome_build      required when the bigwig branch runs (UCSC hub label)
#   gtf               required when the splicing branch runs
#
# Two constraints worth checking before you point at existing indices:
#   * the Salmon index must retain full GENCODE FASTA headers
#     (ENST...|ENSG...|...|SYMBOL|...). An index built with
#     `salmon index --gencode` strips them and the DESeq2 step will stop.
#   * transcripts_bed must match the genome build the BAMs are aligned to.
# ------------------------------------------------------------
references:
  human:
    star_genome_dir: "/path/to/references/human/STAR_index_GRCh38"
    salmon_index_dir: "/path/to/references/human/salmon_index_GRCh38"
    transcripts_bed: "/path/to/references/human/gencode_v41_transcripts.bed"
    chrom_sizes: "/path/to/references/human/hg38.chrom.sizes"
    genome_build: "hg38"
    gtf: "/path/to/references/human/gencode.v41.annotation.gtf"
  mouse:
    star_genome_dir: "/path/to/references/mouse/STAR_index_GRCm39"
    salmon_index_dir: "/path/to/references/mouse/salmon_index_GRCm39"
    transcripts_bed: "/path/to/references/mouse/gencode_vM37_transcripts.bed"
    chrom_sizes: "/path/to/references/mouse/mm39.chrom.sizes"
    genome_build: "mm39"
    gtf: "/path/to/references/mouse/gencode.vM37.annotation.gtf"

# ------------------------------------------------------------
# Sample sheet (TSV). Required columns:
#   sample_name        name used throughout the pipeline; must be unique
#                       and must not contain "/"
#   species            must match a key under `references` above
#   read_pair1         read 1 filename, OR an SRA accession (SRR/ERR/DRR)
#   read_pair2         read 2 filename; blank means single-end
#   raw_data_dir       directory holding the FASTQs; blank for SRA samples,
#                       which download into pre_processing_dir instead
#   pre_processing_dir directory under which this sample's outputs go
#   generate_bw        "yes" or "no"; when yes the bigwig / genome-browser
#                       branch runs for this sample
#
# Single vs paired-end, strandedness and read length are all inferred --
# do not declare them here.
# ------------------------------------------------------------
samples_tsv: "samples.tsv"

# Conda environment used by every rule that has no more specific one.
# May name a .yaml spec (built automatically) or an existing environment.
conda_env: "environment_RNAseq.yaml"

# ------------------------------------------------------------
# Resource allocations per pipeline stage.
#
# These are authoritative -- the cluster profile should not also set
# mem_mb/threads, or the two will drift. disk_mb belongs in the profile,
# being a scheduler concern.
# ------------------------------------------------------------
resources:
  trimming:
    threads: 8
    mem_mb: 10000
  alignment:          # STAR and Salmon
    threads: 20
    mem_mb: 40000
  sorting:            # samtools sort, also used for the strand BAMs
    threads: 8
    mem_mb: 10000
  bigwig:
    threads: 4
    mem_mb: 16000

# ============================================================
# BigWig / genome-browser branch
# Runs per sample, controlled by generate_bw in samples.tsv.
# ============================================================
bigwig:
  # UCSC bedGraphToBigWig binary. environment_RNAseq.yaml also ships
  # ucsc-bedgraphtobigwig, so "bedGraphToBigWig" works if you would rather
  # use the conda copy than a local one.
  bedgraph_to_bigwig: "/path/to/tools/bedGraphToBigWig"

  # Written into the track hub's hub.txt
  hub_email: "your.name@institution.edu"

  # Coverage normalisation: scaled = raw_coverage * scale_factor / mapped_reads
  # 1e8 gives the "reads per 10^8" convention; the suffix appears in filenames.
  scale_factor: 100000000
  scale_suffix: "RP10_8"

  # A library is called strand-specific when the larger of the two
  # "Fraction of reads explained by ..." values from RSeQC's
  # infer_experiment.py reaches this threshold.
  strand_threshold: 0.75

# ============================================================
# Differential gene expression (DESeq2, from the Salmon quantifications)
# ============================================================
dge:
  # Master switch. When false these rules never enter the DAG.
  # experimental_design.tsv is read when EITHER dge.enabled or
  # splicing.enabled is true, and is not required when both are false.
  enabled: true

  # Columns: sample_name, group, contrast_A, contrast_B
  #   contrast_A is the reference; log2FoldChange is reported as
  #   contrast_B relative to contrast_A.
  # Each group in a contrast needs at least two replicates.
  experimental_design: "experimental_design.tsv"

  output_dir: "DGE"

  # R/Bioconductor is kept in its own environment so that changing it does
  # not force the main toolchain to be re-solved.
  conda_env: "environment_DESeq2.yaml"

  # Passed to tximport()
  counts_from_abundance: "lengthScaledTPM"

  threads: 4
  mem_mb: 16000

# ============================================================
# Splicing quantification and novel-isoform annotation
# (StringTie assembly/merge + rMATS), from the STAR alignments
# ============================================================
splicing:
  # Master switch. When true, strandedness inference runs for every
  # participating sample regardless of its generate_bw setting, because
  # rMATS and StringTie cannot run without knowing the library type.
  enabled: true

  # Shares experimental_design.tsv with the dge block above. Participating
  # samples are those whose group appears in a contrast pair; a sample in
  # the design but not in any contrast is excluded.
  #
  # All participating samples must share one species, one library type and
  # one layout (paired/single) -- rMATS takes a single --gtf, --libType and
  # -t for the whole run. Disagreement stops the pipeline rather than being
  # averaged away.
  experimental_design: "experimental_design.tsv"

  output_dir: "splicing"
  conda_env: "environment_rMATS.yaml"

  # --- StringTie ---
  # -j : minimum junction coverage during per-sample assembly
  stringtie_min_junction_coverage: 2
  stringtie:
    threads: 4
    mem_mb: 5000
  stringtie_merge:
    threads: 24
    mem_mb: 20000

  # --- rMATS ---
  # --anchorLength : a minimum number of "anchor length" nucleotides must be
  #                  mapped to each end of a given splice junction.
  anchor_length: 4
  # --cstat : cutoff on the splicing difference used by the likelihood-ratio
  #           test, as a proportion (0.01 = 1% PSI difference)
  cstat: 0.01
  rmats_prep:
    threads: 20
    mem_mb: 10000
  rmats_post:
    threads: 4
    mem_mb: 10000

  # As for bigwig, but governs the run-wide --libType call. See the
  # infer_strandedness checkpoint in rules/bigwig.smk for how the two
  # RSeQC fractions map onto fr-firststrand / fr-secondstrand.
  strand_threshold: 0.75

  # --- significance filter applied to SE.MATS.JC.txt ---
  # An event is kept when every replicate in both groups has at least
  # min_reads supporting reads (mean of inclusion and skipping counts),
  # the FDR is below `fdr`, and |delta PSI| is at least min_delta_psi.
  min_reads: 2
  fdr: 0.05
  min_delta_psi: 0.1
